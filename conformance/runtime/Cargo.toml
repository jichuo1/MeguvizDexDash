[package]
name = "mdd-runtime-conformance"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
mdd-types = { path = "../../crates/mdd-types" }
mdd-input = { path = "../../crates/mdd-input" }
mdd-session = { path = "../../crates/mdd-session" }
mdd-worker = { path = "../../crates/mdd-worker" }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks"] }
