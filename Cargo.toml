[workspace]
resolver = "3"
members = ["tools/build-probe", "crates/mdd-types", "crates/mdd-cli", "crates/mdd-input", "crates/mdd-dex", "crates/mdd-session", "crates/mdd-worker", "crates/mdd-facts"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
mdd-types = { path = "crates/mdd-types" }
mdd-input = { path = "crates/mdd-input" }
mdd-dex = { path = "crates/mdd-dex" }
mdd-session = { path = "crates/mdd-session" }
mdd-facts = { path = "crates/mdd-facts" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sha1 = "=0.11.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "vtab", "functions", "collation", "hooks", "limits"] }
getrandom = "=0.4.3"

[profile.release]
codegen-units = 1
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
